<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Home</title>
    <link rel="stylesheet" href="../style/base_containers.css" />
    <link rel="stylesheet" href="../style/buttons_cards.css" />
    <link rel="stylesheet" href="../style/scroll_bar.css" />
    <link rel="stylesheet" href="../style/calendar.css" />
</head>

<body>
    <div class="title-bar"></div>
    <div class="main-container">
        <!-- side bar -->
        <div class="side-bar-container">
            <div class="side-bar">
                <div class="nav-btn-container">
                    <button id="nav-btn_1">Schedule</button>
                    <button id="nav-btn_2">Students</button>
                    <button id="nav-btn_3">Invoices</button>
                    <button id="settings-btn">Settings</button>
                </div>
            </div>
        </div>
        <div class="content-area-wrapper">
            <!-- MID COLUMN -->
            <div class="search_student_list_wrapper">
                <!-- SEARCH -->
                <!-- search bar -->
                <div class="search-container">
                    <form class="search-bar-wrap" id="search-form">
                        <input type="text" id="search-bar" placeholder="Type name to search...">
                        <button type="submit" class="search-btn">Search</button>
                    </form>
                </div>
                <!-- search result -->
                <div class="search-result-container">
                    <div class="search-box-hidden" id="search-result"></div>
                </div>
                <!-- STUDENT LIST -->
                <div class="student-list-container-home" id="student-list-container-h">

                </div>
            </div>
            <!-- right hand column -->
            <div class="right-hand-container">
                <div class="schedule-preview-container">
                    <div class="calendar-grid" id="calendarContainer"></div>
                </div>
                <div class="next-lesson-container"></div>
            </div>
        </div>
    </div>
    </div>
    <script src="../scripts/renderer.js"></script>
</body>

</html>
